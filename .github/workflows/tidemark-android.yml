name: Tidemark Android

on:
  push:
    branches: [claude/android-app-setup-guide-ngexeu]
    paths: ['tidemark/**', '.github/workflows/tidemark-android.yml']
  workflow_dispatch:

concurrency:
  group: tidemark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tidemark
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew --continue :core:test :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee build.log
      - name: Error summary
        if: failure()
        run: |
          echo "=== ERROR SUMMARY ==="
          grep -E '^e: |^w: .*(deprecat|unchecked)|error:|\[ksp\]|FAILED|What went wrong|AAPT|Execution failed|ERROR:|Unresolved|Cannot find|Type mismatch' build.log | grep -v '^w: ' | awk '!seen[$0]++' | head -300
      - name: Show test failures
        if: failure()
        run: |
          find . -path '*/build/test-results/*' -name '*.xml' -exec grep -l '<failure' {} \; | while read f; do echo "== $f"; grep -A 20 '<failure' "$f" | head -60; done
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: tidemark-debug-apk
          path: tidemark/app/build/outputs/apk/debug/*.apk
          retention-days: 14
