name: Tidemark Android

on:
  push:
    branches: [claude/android-app-setup-guide-ngexeu]
    paths: ['tidemark/**', '.github/workflows/tidemark-android.yml']
  workflow_dispatch:

concurrency:
  group: tidemark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tidemark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --stacktrace --continue :core:test :app:assembleDebug :app:testDebugUnitTest
      - name: Show test failures
        if: failure()
        run: |
          find . -path '*/build/test-results/*' -name '*.xml' -exec grep -l '<failure' {} \; | while read f; do echo "== $f"; grep -A 20 '<failure' "$f" | head -60; done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tidemark-debug-apk
          path: tidemark/app/build/outputs/apk/debug/*.apk
          retention-days: 14
